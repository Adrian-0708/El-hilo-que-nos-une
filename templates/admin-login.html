  <!-- ===== ACCESO ADMINISTRACIÓN =====
       POST /admin/login (username, password) → Spring Security (rol ADMIN).
       Si falla, volver a /admin/login?error. Tras cerrar sesión, /admin/login?logout. -->
  <main id="contenido" class="admin-login">
    <div class="center-card stitched">
      <img class="center-card__logo" src="../static/img/logo.png" th:src="@{/img/logo.png}" alt="El hilo que nos une" width="1000" height="346">
      <span class="eyebrow"><svg class="icon"><use href="#i-lock"/></svg>Administración</span>
      <h1 class="h2">Acceso <em>admin</em></h1>
      <p class="muted">Solo para la organización del concurso.</p>

      <div class="alert alert--error" th:if="${param.error}" role="alert" hidden th:hidden="${false}">
        <svg class="icon"><use href="#i-info"/></svg><span>Usuario o contraseña incorrectos.</span>
      </div>
      <div class="alert alert--ok" th:if="${param.logout}" role="status" hidden th:hidden="${false}">
        <svg class="icon"><use href="#i-check"/></svg><span>Has cerrado sesión.</span>
      </div>

      <form class="form" method="post" action="#" th:action="@{/admin/login}" data-admin-login>
        <div class="field">
          <label for="adm-user">Usuario</label>
          <input class="input" id="adm-user" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="adm-pw">Contraseña</label>
          <div class="pw">
            <input class="input" id="adm-pw" name="password" type="password" autocomplete="current-password" required>
            <button class="pw__toggle" type="button" data-toggle-pw aria-label="Mostrar contraseña"><svg class="icon"><use href="#i-eye"/></svg></button>
          </div>
        </div>
        <button class="btn btn--red btn--block" type="submit"><svg class="icon"><use href="#i-lock"/></svg>Entrar al panel</button>
      </form>
      <a class="link" href="index.html" th:href="@{/}">Volver a la web</a>
    </div>
  </main>

  <script src="../static/js/main.js" th:src="@{/js/main.js}" defer></script>
</body>
</html>
